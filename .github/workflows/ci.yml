name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.10.0"
          cache: npm

      - name: Install locked plugin dependencies
        run: npm ci --ignore-scripts

      - name: Audit plugin dependency lock
        run: npm audit --package-lock-only --audit-level high

      # Nested lock is owned by atebites-hub/open-dynamic-workflows. The pinned
      # SHA (and current ODW main) still resolve fast-uri@3.1.5. Keep the step
      # visible; do not fail packaging CI on a lock this repo cannot edit.
      - name: Audit pinned ODW lock
        continue-on-error: true
        run: npm --prefix open-dynamic-workflows audit --package-lock-only --audit-level high

      - name: Verify ODW runtime and plugin bundle
        run: |
          npm run verify
          npm --prefix open-dynamic-workflows run typecheck
          npm --prefix open-dynamic-workflows run smoke
          git diff --exit-code -- dist/mcp/server.js plugins/open-dynamic-workflows
